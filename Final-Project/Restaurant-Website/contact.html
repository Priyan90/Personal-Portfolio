<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spice Garden | Contact</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="data:,">

</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container navbar">

            <a href="index.html" class="logo">
                Spice Garden
            </a>

            <nav>

                <a href="index.html">
                    Home
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="menu.html">
                    Menu
                </a>

                <a href="contact.html" class="active">
                    Contact
                </a>

            </nav>

        </div>

    </header>


    <main>

        <!-- Page heading -->
        <section class="page-header">

            <div class="container">

                <h1>Contact & Booking</h1>

                <p>
                    Reserve a table or send us a message.
                </p>

            </div>

        </section>


        <section class="contact-section">

            <div class="container contact-grid">

                <!-- Contact information -->
                <div class="contact-info">

                    <h2>Get In Touch</h2>

                    <p>
                        We would love to hear from you.
                    </p>

                    <div class="info-item">
                        📍 Indore, India
                    </div>

                    <div class="info-item">
                        📞 +91 98765 00001
                    </div>

                    <div class="info-item">
                        ✉️ hello@spicegarden.com
                    </div>

                    <div class="info-item">
                        🕐 11:00 AM - 11:00 PM
                    </div>

                </div>


                <!-- Booking form -->
                <form id="bookingForm" class="contact-form">

                    <h2>Book a Table</h2>

                    <label for="name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <small
                        id="nameError"
                        class="error-message"
                    ></small>


                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small
                        id="emailError"
                        class="error-message"
                    ></small>


                    <label for="date">
                        Booking Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >


                    <label for="guests">
                        Number of Guests
                    </label>

                    <select id="guests" name="guests">

                        <option value="">
                            Select guests
                        </option>

                        <option value="1">
                            1 Guest
                        </option>

                        <option value="2">
                            2 Guests
                        </option>

                        <option value="3">
                            3 Guests
                        </option>

                        <option value="4">
                            4 Guests
                        </option>

                        <option value="5">
                            5 Guests
                        </option>

                        <option value="6+">
                            6+ Guests
                        </option>

                    </select>


                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Any special request?"
                    ></textarea>


                    <button
                        type="submit"
                        class="btn"
                    >
                        Reserve Table
                    </button>

                    <!-- Success message appears here -->
                    <p
                        id="successMessage"
                        class="success-message"
                    ></p>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="container">

            <p>
                © 2026 Spice Garden. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
